# Chương 2: Cơ sở lý thuyết và cơ sở thực nghiệm
## 2.1. Cơ sở lý thuyết
### 2.1.1. Bệnh truyền nhiễm và nhu cầu giám sát sớm
Bệnh truyền nhiễm là nhóm bệnh do tác nhân gây bệnh như vi khuẩn, virus, ký sinh trùng hoặc nấm gây ra và có khả năng lây truyền trong cộng đồng. Trong thực hành y tế công cộng, giám sát bệnh truyền nhiễm không chỉ dừng ở việc ghi nhận ca bệnh đã xác minh, mà còn cần phát hiện sớm các tín hiệu bất thường để hỗ trợ điều tra, cảnh báo và phản ứng kịp thời.
Tổ chức Y tế Thế giới (WHO) mô tả giám sát y tế công cộng là quá trình thu thập, phân tích và diễn giải có hệ thống dữ liệu liên quan sức khỏe nhằm phục vụ cảnh báo sớm, theo dõi can thiệp và định hướng chính sách y tế [1]. WHO cũng nhấn mạnh rằng phát hiện sớm và phản ứng nhanh trước các tín hiệu sự kiện y tế công cộng có thể giúp ngăn các sự kiện địa phương phát triển thành tình huống khẩn cấp quy mô lớn [2].
Trong bối cảnh đồ án, hệ thống Epi Scout AI tập trung vào giám sát tín hiệu từ truyền thông trực tuyến. Nguồn dữ liệu này không thay thế hệ thống báo cáo chính thức, nhưng có giá trị như một kênh hỗ trợ phát hiện sớm vì báo chí thường phản ánh nhanh các ổ dịch, cảnh báo từ cơ quan y tế, số ca mắc, địa điểm và diễn biến ban đầu.
### 2.1.2. Sự kiện bệnh truyền nhiễm
Sự kiện bệnh truyền nhiễm là một đơn vị thông tin mô tả việc một bệnh hoặc nguy cơ bệnh truyền nhiễm xuất hiện tại một địa điểm trong một khoảng thời gian nhất định. Các nghiên cứu về trích xuất sự kiện dịch bệnh từ tin tức thường mô hình hóa sự kiện tối thiểu theo bộ ba:
```text
E = (name, time, place)
```
Trong đó:
- `name`: tên bệnh hoặc tác nhân gây bệnh.
- `time`: thời điểm xảy ra, phát hiện hoặc được công bố.
- `place`: địa điểm xảy ra sự kiện.

Nguyen và Nguyen đề xuất hướng tiếp cận trích xuất sự kiện dịch bệnh phục vụ hệ thống giám sát thời gian thực, trong đó sự kiện được nhận diện từ văn bản tin tức bằng kết hợp luật ngữ nghĩa và học máy [5]. Bài báo DESRM năm 2015 tiếp tục mở rộng hướng này thành một hệ thống trích xuất bệnh phục vụ giám sát thời gian thực [6]. Đây là cơ sở thực nghiệm trực tiếp cho bài toán của đồ án: chuyển văn bản báo chí phi cấu trúc thành dữ liệu có cấu trúc gồm bệnh, địa điểm, thời gian và số ca.

Trong hệ thống Epi Scout AI, khái niệm này được hiện thực bằng bảng `news_events`. Mỗi `NewsEvent` đại diện cho một sự kiện dịch tễ đã được gom từ nhiều bài báo, với các trường chính gồm `canonical_title`, `disease_name`, `location`, `event_date`, `case_count`, `severity` và `fingerprint`.

### 2.1.3. Giám sát dựa trên sự kiện và nguồn truyền thông trực tuyến

Giám sát dựa trên sự kiện (event-based surveillance) là hướng tiếp cận thu thập, phân tích các tín hiệu chưa hoàn toàn chuẩn hóa như tin tức, thông báo, báo cáo cộng đồng hoặc nguồn trực tuyến. Điểm mạnh của hướng này là tốc độ phát hiện sớm, đặc biệt khi dữ liệu chính thức chưa được tổng hợp đầy đủ.

HealthMap là một ví dụ tiêu biểu: hệ thống thu thập báo cáo dịch bệnh từ nhiều nguồn trực tuyến như Google News, ProMED-mail và thông báo chính thức, sau đó dùng thuật toán xử lý văn bản để phân loại theo bệnh và địa điểm, rồi trực quan hóa trên bản đồ [4]. BioCaster cũng là một hệ thống khai phá văn bản trên Web, dùng RSS và ontology để phát hiện tin đồn/yếu tố cảnh báo liên quan bùng phát bệnh truyền nhiễm [3].

Những công trình này chứng minh rằng báo chí trực tuyến và RSS có thể được dùng như nguồn dữ liệu bổ trợ cho giám sát dịch bệnh. Đồ án kế thừa tư tưởng này nhưng triển khai trong phạm vi Việt Nam, tập trung vào nguồn RSS báo chí, bộ lọc từ khóa dịch tễ, xác minh ngữ cảnh bằng mô hình ngôn ngữ lớn và dashboard phục vụ báo cáo.

### 2.1.4. RSS và thu thập dữ liệu báo chí

RSS (Really Simple Syndication) là định dạng phân phối nội dung Web dựa trên XML. Theo đặc tả RSS 2.0, một tài liệu RSS gồm phần `channel` chứa thông tin kênh và các phần tử `item` đại diện cho từng bài viết, thường có tiêu đề, liên kết, mô tả và thời gian xuất bản [7].

Trong đồ án, RSS phù hợp với bài toán thu thập dữ liệu vì:

- Nhiều báo điện tử Việt Nam cung cấp RSS ổn định theo chuyên mục.
- Dữ liệu có cấu trúc tối thiểu, giúp crawler lấy được `title`, `link`, `summary`, `published_date`.
- Có thể quét định kỳ bằng scheduler mà không cần can thiệp thủ công.

Giới hạn của RSS là một số nguồn thiếu phần tóm tắt, RSS không phải lúc nào cũng theo đúng chuyên mục dịch tễ, và một số bài viết cần tải thêm nội dung `sapo` từ trang gốc. Vì vậy hệ thống hiện bổ sung bước `fetch_sapo()` và làm sạch HTML bằng BeautifulSoup trước khi lọc ngữ cảnh.

### 2.1.5. Xử lý ngôn ngữ tự nhiên và mô hình ngôn ngữ lớn

Xử lý ngôn ngữ tự nhiên (Natural Language Processing - NLP) là nhóm kỹ thuật giúp máy tính phân tích, hiểu và trích xuất thông tin từ văn bản. Với bài toán dịch bệnh, NLP được dùng để:

- nhận diện bài báo có liên quan dịch tễ;
- trích xuất tên bệnh, địa điểm, số ca, mức độ nghiêm trọng;
- loại bỏ tin tư vấn, quảng cáo, đời sống hoặc bài tổng kết không phải sự kiện mới;
- chuẩn hóa văn bản để phục vụ thống kê và trực quan hóa.

Mô hình Transformer do Vaswani và cộng sự đề xuất là nền tảng quan trọng của nhiều mô hình ngôn ngữ hiện đại nhờ cơ chế self-attention, cho phép mô hình học quan hệ giữa các token trong chuỗi mà không phụ thuộc vào kiến trúc hồi quy truyền thống [8]. Các mô hình ngôn ngữ lớn (Large Language Models - LLM) kế thừa hướng này và có khả năng thực hiện tác vụ mới thông qua hướng dẫn hoặc một số ví dụ mẫu. Brown và cộng sự cho thấy mô hình ngôn ngữ có thể thực hiện nhiều tác vụ theo cơ chế few-shot, tức là suy luận từ một số ví dụ trong prompt mà không cần huấn luyện lại cho từng tác vụ [9].

Trong hệ thống Epi Scout AI, LLM được dùng như lớp kiểm tra ngữ nghĩa sau bộ lọc regex/context. Cách này phù hợp với phạm vi đồ án vì không cần tự huấn luyện mô hình học máy từ đầu, nhưng vẫn có thể trích xuất JSON có cấu trúc:

- `label`: `relevant`, `irrelevant` hoặc `unsure`;
- `matched_keywords`: danh sách bệnh/từ khóa được xác nhận;
- `location`: địa điểm;
- `cumulative_cases`, `new_cases`: số ca lũy kế hoặc số ca mới;
- `event_start_date`, `event_end_date`: khoảng thời gian sự kiện nếu bài báo nêu rõ;
- `severity`: mức độ `low`, `medium`, `high`.

### 2.1.6. Vector embedding, độ tương đồng và gom cụm sự kiện

Một sự kiện dịch bệnh có thể được nhiều báo đưa tin với tiêu đề khác nhau. Nếu hệ thống chỉ lưu từng bài báo rời rạc, số ca và số tín hiệu truyền thông có thể bị đếm lặp. Vì vậy cần gom các bài liên quan về cùng một sự kiện.

Sentence-BERT (SBERT) là hướng tiếp cận sinh vector biểu diễn câu sao cho có thể so sánh bằng cosine similarity hiệu quả. Reimers và Gurevych cho thấy SBERT giảm mạnh chi phí so sánh cặp câu so với BERT truyền thống và phù hợp cho bài toán tìm kiếm tương đồng ngữ nghĩa [10].

Trong đồ án, hệ thống dùng mô hình `paraphrase-multilingual-MiniLM-L12-v2` thông qua thư viện SentenceTransformer để tính độ tương đồng tiêu đề và tóm tắt. Hàm `compute_event_similarity_score()` kết hợp nhiều tín hiệu:

- tương đồng tiêu đề: 35%;
- tương đồng tóm tắt/sapo: 25%;
- tương đồng địa điểm: 20%;
- gần nhau về thời gian: 15%;
- tương đồng số ca: 5%.

Nếu tổng điểm đạt ngưỡng `0.75`, bài báo mới được gán vào `NewsEvent` cũ; nếu không, hệ thống tạo sự kiện mới. Cách tiếp cận này bảo toàn từng nguồn báo nhưng thống kê theo mức sự kiện để giảm nhiễu.

### 2.1.7. Phát hiện bất thường bằng Z-score và dự báo chuỗi thời gian

Phát hiện bất thường là bài toán tìm các điểm dữ liệu khác biệt đáng kể so với hành vi bình thường. Chandola, Banerjee và Kumar tổng quan các phương pháp phát hiện bất thường trong nhiều miền dữ liệu, trong đó dữ liệu chuỗi thời gian có thể được giám sát bằng cách so sánh giá trị hiện tại với phân bố lịch sử [11].

Trong hệ thống, Z-score được dùng để phát hiện ngày có số bài hoặc số ca tăng đột biến so với trung bình trượt:

```text
Z = (x - mean) / std
```

Trong đó:

- `x`: số bài hoặc số tín hiệu tại ngày hiện tại;
- `mean`: trung bình của cửa sổ lịch sử;
- `std`: độ lệch chuẩn của cửa sổ lịch sử.

Hàm `get_zscore_spikes()` dùng cửa sổ mặc định 14 ngày. Nếu `zscore >= 3.0`, hệ thống gắn mức `danger`; nếu `zscore >= 2.0`, gắn mức `alert`.

Đối với dự báo, hệ thống dùng Prophet. Taylor và Letham đề xuất Prophet như một mô hình dự báo chuỗi thời gian thực dụng, có thể xử lý xu hướng, mùa vụ và khoảng bất định, phù hợp cho các bài toán dự báo ở quy mô vận hành [12]. Trong đồ án, hàm `get_prophet_forecast()` dùng lịch sử 90 ngày và dự báo 7 ngày tiếp theo khi có đủ dữ liệu dương.

### 2.1.8. Cơ sở pháp lý cho báo cáo bệnh truyền nhiễm

Ở Việt Nam, Thông tư 54/2015/TT-BYT quy định chế độ thông tin báo cáo và khai báo bệnh, dịch bệnh truyền nhiễm, trong đó nêu các trường hợp phải báo cáo, nội dung báo cáo, quy trình báo cáo và các biểu mẫu liên quan [13].

Hệ thống Epi Scout AI không thay thế hệ thống báo cáo chính thức, nhưng mô phỏng một lớp hỗ trợ nghiệp vụ:

- phát hiện bài báo có tín hiệu dịch bệnh;
- trích xuất dữ liệu sơ bộ theo bệnh, thời gian, địa bàn, số ca;
- hỗ trợ dashboard và báo cáo Word/Excel;
- cung cấp dữ liệu tham khảo để người dùng nghiệp vụ kiểm tra, xác minh và tổng hợp.

## 2.2. Cơ sở thực nghiệm

### 2.2.1. Các nghiên cứu và hệ thống liên quan

Các hệ thống giám sát dịch bệnh từ Web cho thấy dữ liệu phi cấu trúc có thể hỗ trợ phát hiện sớm:

| Công trình | Nguồn dữ liệu | Phương pháp chính | Giá trị tham khảo cho đồ án |
| --- | --- | --- | --- |
| BioCaster [3] | RSS, Web news | Text mining, ontology, NER, nhận diện disease/location/event | Củng cố hướng thu thập tin tức và trích xuất thực thể dịch tễ. |
| HealthMap [4] | Google News, ProMED-mail, WHO, nguồn trực tuyến | Thu thập, lọc, phân loại theo bệnh/địa điểm, bản đồ hóa | Chứng minh mô hình dashboard giám sát dịch bệnh từ tin tức trực tuyến. |
| Nguyen & Nguyen 2013 [5] | Tin tức dịch bệnh | Luật ngữ nghĩa kết hợp học máy | Là cơ sở gần với bài toán trích xuất sự kiện bệnh từ văn bản. |
| DESRM 2015 [6] | Tin tức thời gian thực | Disease extraction system | Là công trình tham khảo trực tiếp cho mô hình hóa sự kiện và pipeline trích xuất. |

Khác với các công trình truyền thống cần bộ dữ liệu gán nhãn lớn để huấn luyện mô hình phân loại, đồ án chọn hướng kết hợp luật lọc, từ khóa, LLM qua API và gom cụm bằng embedding. Lựa chọn này phù hợp với giới hạn thời gian đồ án tốt nghiệp, đồng thời vẫn bám sát kiến trúc thực nghiệm đã được chứng minh trong các hệ thống giám sát dịch bệnh trực tuyến.

### 2.2.2. Cơ sở thực nghiệm của hệ thống Epi Scout AI

Hệ thống hiện tại gồm:

- Backend: Python, FastAPI, SQLAlchemy, Alembic, APScheduler.
- Frontend: React, Vite, TypeScript, Tailwind CSS, shadcn/ui.
- Dữ liệu: MySQL, các bảng `keywords`, `rss_sources`, `article_identity`, `article_details`, `disease_cases`, `news_events`.
- Thu thập: `feedparser`, Google News RSS khi quét hồi cứu theo khoảng ngày, BeautifulSoup để làm sạch HTML và lấy sapo.
- NLP: regex/context scoring, LLM re-check qua API tương thích OpenAI, schema JSON bắt buộc.
- Gom cụm: SentenceTransformer và hàm tính điểm đa tiêu chí.
- Phân tích: overview stats, heatmap địa bàn, trend, Z-score, Prophet forecast.
- Báo cáo: xuất Word, Excel và gửi email qua Mailtrap.

Luồng dữ liệu thực nghiệm đi từ bài báo RSS đến dashboard theo chuỗi:

```text
RSS/Google News -> Article candidate -> Regex/context filter -> LLM re-check
-> NewsEvent + DiseaseCase -> Stats API -> Dashboard/Report
```

### 2.2.3. Giả thuyết thực nghiệm

Đồ án có thể kiểm chứng các giả thuyết sau:

1. Bộ lọc regex/context giúp giảm số bài không liên quan trước khi gọi LLM, từ đó giảm chi phí xử lý.
2. LLM re-check giúp giảm false positive của các bài tư vấn, quảng cáo, đời sống hoặc bài không chứa sự kiện dịch tễ cụ thể.
3. Gom cụm theo `NewsEvent` giúp thống kê ổ dịch ổn định hơn so với thống kê trực tiếp theo từng bài báo.
4. Z-score giúp phát hiện các ngày có tín hiệu truyền thông bất thường.
5. Prophet chỉ có ý nghĩa khi dữ liệu lịch sử đủ dày; nếu dữ liệu ít, kết quả nên được trình bày như tham khảo, không phải dự báo y tế chính thức.

# Chương 3: Phương pháp và quy trình thực hiện

## 3.1. Mục tiêu và phạm vi thực hiện

Mục tiêu của đồ án là xây dựng hệ thống hỗ trợ giám sát thông tin truyền thông về bệnh truyền nhiễm và hỗ trợ xuất báo cáo tự động. Đồ án không tập trung vào huấn luyện một mô hình học máy mới từ đầu, mà xây dựng pipeline dữ liệu hoàn chỉnh:

1. thu thập dữ liệu từ RSS và nguồn tổng hợp;
2. làm sạch và lọc văn bản;
3. dùng NLP/LLM để trích xuất tri thức dịch tễ;
4. gom nhiều bài báo về cùng một sự kiện;
5. lưu trữ dữ liệu có cấu trúc;
6. phân tích, trực quan hóa và xuất báo cáo.

Tiêu chí chấp nhận của hệ thống:

- thu thập được bài viết từ các nguồn RSS đang bật trong DB;
- lọc được bài không liên quan ở nhiều tầng;
- trích xuất được tối thiểu bệnh, địa điểm, số ca và thời gian;
- chống đếm trùng ở mức sự kiện;
- cung cấp dashboard và báo cáo phục vụ người dùng nghiệp vụ;
- có cơ chế cấu hình nguồn, keyword, scheduler và email trên giao diện quản trị.

## 3.2. Mô hình phân tích thiết kế và quy trình tổng thể

### 3.2.1. Biểu đồ hoạt động — Quét và xử lý bài viết dịch tễ

Biểu đồ hoạt động của ca sử dụng "Quét và xử lý bài viết" mô tả luồng xử lý chính từ lúc hệ thống bắt đầu quét nguồn RSS đến khi dữ liệu được lưu vào cơ sở dữ liệu:

```mermaid
flowchart TD
    Start(( )) --> A[Kích hoạt quét - Scheduler hoặc thủ công]
    A --> B[Đọc danh sách nguồn RSS active từ CSDL]
    B --> C[Lấy danh sách bài viết từ feedparser]
    C --> D{Bài viết đã tồn tại trong CSDL?}
    D -- Có --> E[Bỏ qua bài trùng]
    D -- Không --> F[Chuẩn hóa title, summary, date]
    F --> G[Lọc Stage 1: keyword + context scoring]
    G --> H{Đạt ngưỡng điểm?}
    H -- Không --> I[Loại bỏ bài không liên quan]
    H -- Có --> J[Lấy sapo từ trang gốc và làm sạch HTML]
    J --> K{LLM được bật?}
    K -- Không --> L[Dùng dữ liệu từ regex làm kết quả]
    K -- Có --> M[Gửi prompt + JSON schema đến LLM API]
    M --> N{LLM trả kết quả hợp lệ?}
    N -- Không --> O[Gán label = unsure và dùng fallback regex]
    N -- Có --> P{label = relevant hoặc unsure?}
    P -- Không --> I
    O --> Q[Trích xuất disease, location, case_count, severity]
    P -- Có --> Q
    Q --> R[Tìm NewsEvent gần nhất theo bệnh và địa điểm]
    R --> S{Similarity score >= 0.75?}
    S -- Có --> T[Gán bài vào event cũ và cập nhật số ca]
    S -- Không --> U[Tạo NewsEvent mới]
    T --> V[Lưu ArticleIdentity, ArticleDetails, DiseaseCase vào CSDL]
    U --> V
    L --> Q
    V --> W{Còn bài viết tiếp theo?}
    W -- Có --> D
    E --> W
    I --> W
    W -- Không --> X[Hoàn tất quét - Trả kết quả scan]
    X --> End(( ))
```

Hình 3.1: Biểu đồ hoạt động của ca sử dụng Quét và xử lý bài viết dịch tễ.

### 3.2.2. Biểu đồ tuần tự — Quét và xử lý bài viết dịch tễ

Biểu đồ tuần tự thể hiện trình tự tương tác giữa các thành phần khi hệ thống thực hiện một phiên quét:

```mermaid
sequenceDiagram
    actor User as Người dùng / Scheduler
    participant API as FastAPI Router
    participant Crawler as Crawler Module
    participant Filter as Keyword Filter
    participant LLM as LLM API
    participant Dedup as Event Resolver
    participant DB as MySQL Database

    User ->> API: Gửi yêu cầu quét (POST /api/scan)
    API ->> DB: Lấy danh sách RSS sources active
    DB -->> API: Trả danh sách nguồn
    API ->> Crawler: Kích hoạt quét nguồn RSS
    Crawler ->> Crawler: feedparser đọc từng nguồn
    Crawler -->> API: Trả danh sách bài viết thô

    loop Với mỗi bài viết
        API ->> DB: Kiểm tra bài đã tồn tại?
        DB -->> API: Trả kết quả
        alt Bài chưa tồn tại
            API ->> Filter: Lọc Stage 1 (keyword + context)
            Filter -->> API: Trả điểm và candidate_keywords
            alt Đạt ngưỡng
                API ->> LLM: Gửi title + summary + prompt
                LLM -->> API: Trả JSON (label, diseases, location, severity)
                alt label = relevant hoặc unsure
                    API ->> Dedup: Gom cụm NewsEvent (similarity scoring)
                    Dedup ->> DB: Tìm event gần nhất
                    DB -->> Dedup: Trả kết quả event
                    alt Score >= 0.75
                        Dedup ->> DB: Cập nhật event cũ
                    else Score < 0.75
                        Dedup ->> DB: Tạo event mới
                    end
                    Dedup -->> API: Trả event_id
                    API ->> DB: Lưu ArticleIdentity, ArticleDetails, DiseaseCase
                end
            end
        end
    end

    API -->> User: Trả kết quả scan (số bài lưu, số event)
```

Hình 3.2: Biểu đồ tuần tự của ca sử dụng Quét và xử lý bài viết dịch tễ.

### 3.2.3. Biểu đồ Use Case tổng quát

Mô hình phân tích chức năng (Use Case) thể hiện các tương tác chính của người dùng với hệ thống:

```mermaid
flowchart LR
    User([Người dùng nghiệp vụ])
    Admin([Quản trị viên])
    
    User --> UC1(Xem Dashboard thống kê)
    User --> UC2(Xem bản đồ dịch tễ)
    User --> UC3(Xuất báo cáo Word/Excel)
    User --> UC4(Xem danh sách cảnh báo)
    
    Admin --> UC5(Quản lý nguồn RSS)
    Admin --> UC6(Quản lý từ khóa dịch bệnh)
    Admin --> UC7(Cấu hình hệ thống/Scheduler)
    
    Admin -.->|Kế thừa quyền| User
```

### 3.2.4. Quy trình hoạt động tổng thể

```mermaid
flowchart TD
    A["Nguồn tin RSS / Google News RSS"] --> B["Crawler"]
    B --> C["Chuẩn hóa dữ liệu bài viết"]
    C --> D["Lọc Stage 1: keyword + regex + context"]
    D --> E{"Có ứng viên dịch tễ?"}
    E -- "Không" --> F["Loại bỏ"]
    E -- "Có" --> G["Lấy sapo và làm sạch HTML"]
    G --> H["LLM re-check theo prompt và JSON schema"]
    H --> I{"label"}
    I -- "irrelevant" --> F
    I -- "relevant / unsure" --> J["Trích xuất disease, location, case_count, severity"]
    J --> K["Gom cụm NewsEvent"]
    K --> L["Lưu ArticleIdentity, ArticleDetails, DiseaseCase"]
    L --> M["Stats API"]
    M --> N["Dashboard, cảnh báo, báo cáo Word/Excel/Email"]
```

Phiên giải:

- Khối `Crawler` đọc danh sách nguồn active từ bảng `rss_sources`, không còn phụ thuộc danh sách RSS hardcode.
- Khối chuẩn hóa dữ liệu đưa mỗi bài viết về các trường thống nhất: tiêu đề, link, mô tả, nguồn và ngày đăng.
- Stage 1 ưu tiên độ bao phủ cao: chỉ cần bài có tín hiệu keyword và ngữ cảnh dịch tễ đủ mạnh thì được giữ lại.
- Stage 2 dùng LLM để tăng độ chính xác, đặc biệt với các bài dễ nhầm như tư vấn sức khỏe, dinh dưỡng, quảng cáo hoặc bài tổng kết lịch sử.
- Sau khi trích xuất thực thể, hệ thống gom bài vào `NewsEvent` để tránh một ổ dịch bị đếm nhiều lần.
- Dữ liệu đã lưu được các API thống kê đọc lại để phục vụ dashboard và báo cáo.

## 3.3. Phương pháp thu thập và tiền xử lý dữ liệu

### 3.3.1. Thu thập dữ liệu

Hệ thống sử dụng `feedparser` để đọc các RSS đang active trong DB. Khi người dùng quét theo khoảng ngày, hệ thống bổ sung truy vấn Google News RSS giới hạn theo các domain trusted đã suy ra từ `rss_sources`.

Dữ liệu đầu vào của mỗi bài gồm:

- `title`: tiêu đề;
- `link`: liên kết gốc;
- `summary`: tóm tắt từ RSS;
- `published_date`: thời gian xuất bản;
- `source`: domain nguồn.

### 3.3.2. Làm sạch dữ liệu

Hàm `normalize_text()` xử lý các vấn đề sau:

- giải mã HTML entity;
- loại bỏ `script`, `style`, `noscript`, `iframe`, `svg`;
- loại bỏ các khối nhiễu như header, footer, nav, aside, quảng cáo, tin liên quan;
- chuẩn hóa khoảng trắng.

Với các RSS thiếu tóm tắt hoặc tóm tắt không đủ thông tin, `fetch_sapo()` tải trang gốc và ưu tiên trích các class phổ biến như `sapo`, `lead`, `article-sapo`, `article-desc`, sau đó fallback về đoạn `<p>` đầu tiên trong content.

### 3.3.3. Chuẩn hóa thời gian và nguồn

Hàm `parse_date_advanced()` dùng `dateutil` và `pytz` để xử lý nhiều định dạng ngày tháng, sau đó quy đổi về múi giờ Việt Nam. Link Google News được giải mã bằng `get_source_url()` để lấy URL báo gốc trước khi xác định domain.

## 3.4. Phương pháp lọc và trích xuất tri thức

### 3.4.1. Lọc Stage 1 bằng keyword và ngữ cảnh
 
```mermaid
flowchart LR
    A["Title + Summary"] --> B["normalize_text"]
    B --> C["Hard exclude title terms"]
    C --> D["score_keyword_context"]
    D --> E{"Đạt ngưỡng?"}
    E -- "Không" --> F["Bỏ qua"]
    E -- "Có" --> G["candidate_keywords"]
    G --> H["LLM re-check"]
```

Phiên giải:

- `HARD_EXCLUDE_TITLE_TERMS` loại bỏ sớm các bài có dấu hiệu tư vấn, quảng cáo, làm đẹp, mẹo vặt, video hoặc nội dung đời sống.
- `EPIDEMIC_CONTEXT_TERMS` tăng điểm khi văn bản chứa ngữ cảnh như ổ dịch, ca mắc, lây lan, xét nghiệm, tử vong, nhập viện.
- `NON_EPIDEMIC_CONTEXT_TERMS` giảm điểm khi văn bản nghiêng về tư vấn cá nhân, dinh dưỡng, triệu chứng chung hoặc bài mẹo.
- Ngưỡng lọc thay đổi theo việc bật/tắt LLM: khi có LLM, Stage 1 có thể rộng hơn để ưu tiên recall.

### 3.4.2. LLM re-check và schema JSON

LLM được gọi qua API tương thích OpenAI với `temperature = 0` và `response_format = json_object`. Prompt gồm:

- ví dụ few-shot cho bài `relevant`, `irrelevant`, `unsure`;
- tiêu chí phân loại;
- danh sách keyword được phép chọn;
- schema JSON bắt buộc;
- tiêu đề và tóm tắt bài báo cần phân tích.

Schema đầu ra mong muốn:

```json
{
  "label": "relevant",
  "matched_keywords": ["sốt xuất huyết"],
  "location": "Hà Nội",
  "diseases": [
    {
      "disease_name": "sốt xuất huyết",
      "cumulative_cases": 120,
      "new_cases": 0,
      "event_start_date": "2026-04-01",
      "event_end_date": "2026-04-07"
    }
  ],
  "severity": "medium",
  "reason": "Bài báo nêu rõ số ca và địa bàn."
}
```

Phiên giải schema JSON:

- `label`: Nhãn phân loại bài báo, nhận một trong ba giá trị: `relevant` (có sự kiện dịch tễ), `irrelevant` (không liên quan) hoặc `unsure` (không chắc chắn, cần người dùng xác minh).
- `matched_keywords`: Mảng chứa các từ khóa hoặc tên bệnh được mô hình phát hiện trong văn bản.
- `location`: Địa điểm xảy ra sự kiện dịch tễ (ví dụ: tỉnh/thành phố, quận/huyện).
- `diseases`: Danh sách các đối tượng chi tiết cho từng bệnh được đề cập:
  - `disease_name`: Tên bệnh truyền nhiễm.
  - `cumulative_cases`: Số ca mắc lũy kế (nếu có).
  - `new_cases`: Số ca mắc mới trong thời gian báo cáo.
  - `event_start_date` / `event_end_date`: Khoảng thời gian bắt đầu và kết thúc của sự kiện (định dạng YYYY-MM-DD).
- `severity`: Mức độ nghiêm trọng của sự kiện (được đánh giá là `low`, `medium`, hoặc `high`).
- `reason`: Lý do mô hình đưa ra quyết định gán nhãn, cung cấp tính minh bạch (explainability) cho quá trình trích xuất.

Nếu LLM lỗi, timeout, rate limit hoặc trả JSON không hợp lệ, hệ thống không loại bỏ bài ngay mà trả `unsure` và dùng dữ liệu fallback từ regex. Cách này giúp giảm rủi ro mất tín hiệu quan trọng khi provider AI không ổn định.

## 3.5. Phương pháp gom cụm và chống trùng sự kiện

```mermaid
flowchart TD
    A["Bài viết đã trích xuất"] --> B["Xác định primary disease"]
    B --> C["Tìm NewsEvent gần nhất trong +/- 3 ngày"]
    C --> D["Tính similarity score"]
    D --> E{"score >= 0.75?"}
    E -- "Có" --> F["Gán article vào event cũ"]
    F --> G["Cập nhật case_count và severity"]
    E -- "Không" --> H["Tạo NewsEvent mới"]
    G --> I["Lưu event_id, event_match_score, dedupe_reason"]
    H --> I
```

Phiên giải:

- Hệ thống chỉ so sánh với các event gần về bệnh, địa điểm và thời gian để giảm chi phí.
- Điểm tương đồng gồm tiêu đề, tóm tắt, địa điểm, ngày đăng và số ca.
- Khi ghép vào event cũ, hệ thống cập nhật số ca theo nguyên tắc ưu tiên số ca mới hoặc phần chênh lệch dương của số ca lũy kế.
- Khi tạo event mới, hệ thống sinh `fingerprint` từ bệnh, địa điểm và ngày.
- Mỗi bài vẫn được lưu riêng để bảo toàn nguồn, nhưng thống kê vận hành dùng `NewsEvent` để tránh đếm lặp.

## 3.6. Phương pháp lưu trữ dữ liệu

Mô hình dữ liệu chính:

| Bảng | Vai trò | Trường quan trọng |
| --- | --- | --- |
| `keywords` | Quản lý từ khóa/bệnh cần giám sát | `text`, `is_active` |
| `rss_sources` | Quản lý nguồn RSS | `url`, `label`, `category`, `is_active` |
| `article_identity` | Lưu định danh bài báo | `title`, `link`, `published_date`, `event_id`, `event_match_score` |
| `article_details` | Lưu chi tiết bài báo | `summary`, `source`, `keywords_matched`, `tags`, `is_whitelisted` |
| `disease_cases` | Lưu số ca theo bệnh, ngày, địa bàn | `disease_name`, `case_count`, `location`, `report_date` |
| `news_events` | Lưu sự kiện dịch tễ đã gom cụm | `disease_name`, `location`, `event_date`, `case_count`, `severity` |

Thiết kế này tách bài báo, chi tiết nội dung, ca bệnh và sự kiện. Nhờ vậy hệ thống vừa truy vết được nguồn báo gốc, vừa thống kê được theo mức sự kiện.

## 3.7. Phân tích, trực quan hóa và báo cáo

```mermaid
flowchart LR
    A["DiseaseCase + NewsEvent"] --> B["Overview stats"]
    A --> C["Top diseases"]
    A --> D["Heatmap địa bàn"]
    A --> E["Trend / stacked trend"]
    A --> F["Z-score spike detection"]
    A --> G["Prophet forecast"]
    B --> H["Dashboard"]
    C --> H
    D --> H
    E --> H
    F --> H
    G --> H
    H --> I["Word / Excel report"]
    I --> J["Email qua Mailtrap"]
```

Phiên giải:

- `get_overview_stats()` trả tổng số bài, tổng số ca theo event, số cảnh báo và bệnh được nhắc nhiều nhất.
- `get_heatmap_data()` và `get_location_heatmap_data()` phục vụ bản đồ theo địa bàn.
- `get_stacked_trend_data()` và `get_interest_trends()` biểu diễn xu hướng theo ngày và theo bệnh.
- `get_zscore_spikes()` phát hiện ngày có số tín hiệu vượt ngưỡng.
- `get_prophet_forecast()` dự báo ngắn hạn khi có đủ dữ liệu lịch sử.
- Module `report` dựng Word/Excel và gửi email theo cấu hình người dùng.

## 3.8. Phương pháp triển khai ứng dụng

Hệ thống triển khai theo kiến trúc client-server:

- Backend FastAPI xử lý API, crawler, scheduler, thống kê, báo cáo và xác thực JWT.
- Frontend React/Vite hiển thị dashboard, tab phân tích, cảnh báo cá nhân, bookmark và admin panel.
- MySQL lưu dữ liệu nghiệp vụ.
- APScheduler chạy auto scan theo chu kỳ cấu hình.
- Mailtrap hỗ trợ gửi báo cáo email trong môi trường demo.

Các API chính gồm:

- `/api/scan`, `/api/scan-status`, `/api/scheduler/status`;
- `/api/articles`, `/api/events`;
- `/api/stats/overview`, `/api/stats/trends`, `/api/stats/zscore`, `/api/stats/forecast`;
- `/api/report/generate`, `/api/report/export-excel`, `/api/report/send-email`;
- `/api/keywords`, `/api/rss-sources`, `/api/alerts`.

## 3.9. Kế hoạch đánh giá thực nghiệm

Để đánh giá kết quả, cần chuẩn bị một tập bài báo mẫu đã được gán nhãn thủ công. Tối thiểu nên có ba nhãn:

- `relevant`: bài có sự kiện dịch tễ cụ thể.
- `irrelevant`: bài không phải sự kiện dịch tễ.
- `unsure`: bài mơ hồ, cần người nghiệp vụ xác minh.

Các chỉ số nên dùng:

| Nhóm đánh giá | Chỉ số | Cách đo |
| --- | --- | --- |
| Lọc bài liên quan | Precision, Recall, F1-score | So sánh nhãn hệ thống với nhãn thủ công. |
| Trích xuất thực thể | Accuracy theo bệnh, địa điểm, số ca, ngày | Đếm số trường trích đúng trên tập kiểm thử. |
| Gom cụm event | Pairwise precision/recall hoặc kiểm tra thủ công theo event | Xem các bài cùng ổ dịch có được gom đúng không. |
| Vận hành crawler | Số bài thô, số bài qua Stage 1, số bài lưu, thời gian scan | Ghi nhận từ kết quả scan và log. |
| Phân tích dashboard | Số spike phát hiện, số cảnh báo đúng | Đối chiếu với sự kiện nổi bật trong dữ liệu. |

## 3.10. Phác thảo nội dung kết quả

Phần kết quả của đồ án nên trình bày theo hướng sau:

### 3.10.1. Kết quả thu thập dữ liệu

Gợi ý bảng:

| Chỉ tiêu | Giá trị cần điền |
| --- | --- |
| Số nguồn RSS cấu hình | ... |
| Số nguồn đang active | ... |
| Thời gian thu thập | từ ... đến ... |
| Tổng số bài đọc từ RSS/Google News | ... |
| Tổng số bài qua Stage 1 | ... |
| Tổng số bài được lưu | ... |
| Tổng số event tạo mới | ... |

Nội dung phân tích nên nêu nguồn nào tạo nhiều tín hiệu nhất, nguồn nào ít dữ liệu, nguồn nào thường thiếu summary hoặc lỗi parse.

### 3.10.2. Kết quả lọc và trích xuất

Gợi ý bảng:

| Nhãn | Số lượng | Tỉ lệ |
| --- | ---: | ---: |
| Relevant | ... | ... |
| Irrelevant | ... | ... |
| Unsure | ... | ... |

Cần mô tả các lỗi điển hình:

- bài tư vấn sức khỏe bị nhận nhầm là sự kiện;
- bài có số ca nhưng không rõ địa điểm;
- bài nêu nhiều bệnh cùng lúc;
- bài dùng số liệu lũy kế làm sai lệch số ca mới.

### 3.10.3. Kết quả gom cụm sự kiện

Nên trình bày 3 đến 5 event tiêu biểu:

| Event | Bệnh | Địa điểm | Số bài liên quan | Số nguồn | Số ca hệ thống ghi nhận |
| --- | --- | --- | ---: | ---: | ---: |
| ... | ... | ... | ... | ... | ... |

Phần diễn giải cần làm rõ vì sao gom cụm giúp giảm đếm trùng so với thống kê theo từng bài báo.

### 3.10.4. Kết quả dashboard và cảnh báo

Nên đưa các hình:

- dashboard tổng quan;
- bản đồ heatmap theo địa bàn;
- biểu đồ top bệnh;
- biểu đồ trend theo ngày;
- biểu đồ Z-score spike;
- biểu đồ forecast nếu đủ dữ liệu.

Với mỗi hình, cần mô tả ngắn: dữ liệu đầu vào, ý nghĩa biểu đồ, tín hiệu nổi bật và giới hạn diễn giải.

### 3.10.5. Kết quả báo cáo tự động

Nên minh họa:

- file Word báo cáo tuần;
- file Excel theo biểu mẫu;
- email gửi báo cáo;
- cấu hình lịch gửi theo người dùng.

Phần này cần nhấn mạnh hệ thống chỉ hỗ trợ tổng hợp ban đầu, dữ liệu vẫn cần người nghiệp vụ xác minh trước khi dùng như báo cáo chính thức.

### 3.10.6. Hạn chế và hướng phát triển

Các hạn chế cần nêu:

- RSS không bao phủ toàn bộ tin tức;
- LLM có thể sai hoặc không ổn định khi timeout/rate limit;
- số ca từ báo chí có thể là số mới hoặc số lũy kế;
- gom cụm event phụ thuộc vào chất lượng địa điểm, ngày và tiêu đề;
- Prophet không đáng tin khi dữ liệu lịch sử quá ít.

Hướng phát triển:

- mở rộng `rss_sources` thành `news_sources` có `source_type`;
- tách adapter RSS, Google News, sitemap và HTML listing;
- thêm bảng `crawl_runs` và `source_health`;
- bổ sung bộ dữ liệu gán nhãn để đánh giá định lượng;
- kết hợp nguồn chính thức từ Bộ Y tế/CDC khi có API hoặc dữ liệu mở.

